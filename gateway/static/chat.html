<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eir Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Mega Care Ultra Premium Mint Scale */
            --mint-50: #f2fcf8;
            --mint-100: #e0f6eb;
            --mint-200: #bfeadb;
            --mint-300: #91d7c0;
            --mint-400: #5cbda0;
            --mint-500: #38a183;
            --mint-600: #298269;
            --mint-700: #236855;
            --mint-800: #1f5345;
            --mint-900: #1a453a;
            --mint-950: #0e2722;

            --bg-main: #fcfdfe; /* Icy white */
            --bg-sidebar: #fafffd;
            --bg-card: rgba(255, 255, 255, 0.85); /* Glass basis */
            --bg-input: rgba(255, 255, 255, 0.95);
            --border: #e0ece6;
            --border-light: rgba(191, 234, 219, 0.3);
            --text-primary: #0e2722;
            --text-secondary: #236855;
            --text-muted: #648a7f;
            --shadow-sm: 0 2px 8px rgba(41, 130, 105, 0.04);
            --shadow-md: 0 8px 24px rgba(41, 130, 105, 0.08);
            --shadow-lg: 0 12px 48px rgba(41, 130, 105, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ─── Header ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.85); /* Glass White */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(41, 130, 105, 0.15);
            color: var(--mint-800);
            box-shadow: 0 4px 24px rgba(41, 130, 105, 0.06);
            position: relative;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--mint-100), var(--mint-50));
            color: var(--mint-600);
            border: 1px solid var(--mint-200);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 2px 8px rgba(41, 130, 105, 0.1);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 11px;
            opacity: 0.85;
            font-weight: 400;
            display: none;
        }

        .header-right {
            display: none;
        }

        /* ─── Main Container ─── */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ─── Function Bar ─── */
        /* ─── Messages ─── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--mint-200); border-radius: 3px; }

        .message {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.agent { align-self: flex-start; }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--mint-500), var(--mint-600));
            color: white;
            font-size: 14px;
        }
        .message.agent .message-avatar {
            background: linear-gradient(135deg, var(--mint-100), var(--mint-200));
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 13.5px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--mint-500), var(--mint-600));
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(41, 130, 105, 0.15);
        }
        .message.agent .message-bubble {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message-bubble .thinking {
            color: var(--mint-600);
            font-style: italic;
            font-size: 12.5px;
        }
        .message-bubble .tool-call {
            color: var(--mint-700);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            padding: 4px 8px;
            background: var(--mint-50);
            border: 1px solid var(--mint-200);
            border-radius: 6px;
            display: inline-block;
            margin: 4px 0;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--mint-400);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ─── Welcome ─── */
        .welcome {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-secondary);
        }
        .welcome-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--mint-100), var(--mint-200));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: var(--shadow-md);
        }
        .welcome h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .welcome p {
            font-size: 13px;
            max-width: 340px;
            margin: 0 auto;
            line-height: 1.6;
            color: var(--text-muted);
        }

        /* ─── Input ─── */
        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 16px 14px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
        }

        textarea {
            flex: 1;
            padding: 10px 14px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            resize: none;
            outline: none;
            min-height: 42px;
            max-height: 100px;
            transition: all 0.3s;
            box-shadow: 0 2px 10px rgba(41, 130, 105, 0.02);
        }
        textarea:focus {
            border-color: var(--mint-400);
            box-shadow: 0 4px 16px rgba(92, 189, 160, 0.15);
        }
        textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--mint-500), var(--mint-600));
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
        }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(22, 163, 74, 0.4); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ─── Error ─── */
        .error-banner {
            padding: 8px 16px;
            background: #fef2f2;
            border-bottom: 1px solid #fecaca;
            color: #dc2626;
            font-size: 12px;
            display: none;
        }
        .error-banner.visible { display: block; }

        /* ─── Minimal UI ─── */
        .header-right { display: none !important; }

        /* ─── File Upload ─── */
        #docInput {
            display: none;
        }

        .attach-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--mint-500);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .attach-btn:hover {
            background: var(--mint-50);
            color: var(--mint-600);
        }

        .attach-name {
            font-size: 11px;
            color: var(--mint-500);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 8px;
            text-align: center;
        }

        /* ─── Mobile ─── */
        @media (max-width: 480px) {
            .function-bar { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .func-desc { display: none; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-logo">⚕️</div>
            <div>
                <h1>Eir Chat</h1>
                <div class="header-subtitle">Asgard AI Medical Assistant</div>
            </div>
        </div>
        <div class="header-right"></div>
    </div>

    <!-- Patient Banner -->
    <div id="patientBanner" style="display:none; padding:6px 16px; background:linear-gradient(135deg, #1e5a50, #0e3a35); font-size:12px; color:#5cffdc; border-bottom:1px solid rgba(92,255,220,0.2);">
      👤 Patient ID: <strong id="patientBannerPid"></strong> — session scoped to this patient
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="error-banner"></div>

    <div class="main-container">
        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="welcome">
                <div class="welcome-icon">⚕️</div>
                <h2>Eir</h2>
                <p>AI Medical Assistant</p>
            </div>
        </div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <input type="file" id="docInput" accept=".pdf,.jpg,.jpeg,.png" />
        <button class="attach-btn" id="attachBtn" title="Attach document" onclick="document.getElementById('docInput').click()">📎</button>
        <span class="attach-name" id="attachName"></span>
        <textarea id="input" placeholder="พิมพ์คำสั่ง... (Enter = ส่ง, Shift+Enter = ขึ้นบรรทัดใหม่)" rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const errorBanner = document.getElementById('error-banner');
        let isStreaming = false;

        // Read patient_id from URL and scope session
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('patient_id') || '';
        const storageKey = 'eir_session_' + (patientId || 'global');
        const sessionId = sessionStorage.getItem(storageKey) || crypto.randomUUID();
        sessionStorage.setItem(storageKey, sessionId);

        // Listen for patient_context postMessage from widget
        window.addEventListener('message', (e) => {
          if (e.data?.type === 'patient_context' && e.data.patient_id !== patientId) {
            sessionStorage.removeItem(storageKey);
            window.location.href = '/chat?patient_id=' + encodeURIComponent(e.data.patient_id || '');
          }
        });

        // Show patient banner if patient_id is known
        if (patientId) {
          document.getElementById('patientBanner').style.display = 'block';
          document.getElementById('patientBannerPid').textContent = patientId;
        }

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
        });

        // Enter to send
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });


        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('visible');
        }

        function addMessage(role, content) {
            const welcome = messagesEl.querySelector('.welcome');
            if (welcome) welcome.remove();
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatar = role === 'user' ? '👤' : '⚕️';
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-bubble">${escapeHtml(content)}</div>
            `;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div.querySelector('.message-bubble');
        }

        function addStreamingMessage() {
            const welcome = messagesEl.querySelector('.welcome');
            if (welcome) welcome.remove();
            const div = document.createElement('div');
            div.className = 'message agent';
            div.id = 'streaming-msg';
            div.innerHTML = `
                <div class="message-avatar">⚕️</div>
                <div class="message-bubble">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            `;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div.querySelector('.message-bubble');
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isStreaming) return;

            addMessage('user', text);
            inputEl.value = '';
            inputEl.style.height = 'auto';

            isStreaming = true;
            sendBtn.disabled = true;
            const bubble = addStreamingMessage();

            try {
                const resp = await fetch('/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId, patient_id: patientId || null }),
                });

                const contentType = resp.headers.get('content-type') || '';

                if (contentType.includes('text/event-stream')) {
                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder();
                    let fullText = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6);
                                if (data === '[DONE]') continue;
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.type === 'thinking') {
                                        bubble.innerHTML = `<span class="thinking">💭 ${escapeHtml(parsed.content)}</span>`;
                                    } else if (parsed.type === 'tool_call') {
                                        fullText += `\n`;
                                        bubble.innerHTML = escapeHtml(fullText) +
                                            `<div class="tool-call">🔧 ${escapeHtml(parsed.tool || parsed.content)}</div>`;
                                    } else if (parsed.type === 'content' || parsed.type === 'text') {
                                        fullText += parsed.content || parsed.text || '';
                                        bubble.innerHTML = escapeHtml(fullText);
                                    } else if (parsed.content) {
                                        fullText += parsed.content;
                                        bubble.innerHTML = escapeHtml(fullText);
                                    }
                                } catch {
                                    fullText += data;
                                    bubble.innerHTML = escapeHtml(fullText);
                                }
                            }
                        }
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                    if (!fullText.trim()) {
                        bubble.textContent = '(ไม่มีการตอบกลับ)';
                    }
                } else {
                    const data = await resp.json();
                    if (data.error) {
                        bubble.innerHTML = `<span style="color:#dc2626">❌ ${escapeHtml(data.error)}</span>`;
                        if (data.hint) {
                            bubble.innerHTML += `<br><span style="color:var(--text-muted);font-size:12px">${escapeHtml(data.hint)}</span>`;
                        }
                    } else {
                        const content = data.response || data.result || data.message || JSON.stringify(data, null, 2);
                        bubble.textContent = content;
                    }
                }
            } catch (e) {
                bubble.innerHTML = `<span style="color:#dc2626">❌ Connection error: ${escapeHtml(e.message)}</span>`;
            }

            isStreaming = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function clearChat() {
            messagesEl.innerHTML = `
                <div class="welcome">
                    <div class="welcome-icon">⚕️</div>
                    <h2>Eir</h2>
                    <p>AI Medical Assistant</p>
                </div>
            `;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // File upload handler
        document.getElementById('docInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const attachName = document.getElementById('attachName');
            const attachBtn = document.getElementById('attachBtn');

            if (!file || !patientId) {
                if (!patientId) showError('❌ Cannot attach: no patient context. Open via OpenEMR patient chart.');
                return;
            }

            attachName.textContent = '⏳ ' + file.name;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('doc_type', 'printed_thai');

            try {
                const resp = await fetch(`/v1/patients/${patientId}/documents`, {
                    method: 'POST',
                    body: formData
                });

                if (!resp.ok) {
                    const error = await resp.text();
                    throw new Error(error || 'Upload failed');
                }

                const data = await resp.json();
                attachName.textContent = '✓ ' + file.name;

                // Auto-trigger chat message
                const msg = `ฉันได้แนบเอกสาร "${file.name}" (ID: ${data.source_id}) กรุณาวิเคราะห์เนื้อหาสำหรับคนไข้ ID: ${patientId}`;
                inputEl.value = msg;
                sendMessage();
            } catch (err) {
                attachName.textContent = '❌ Upload failed';
                showError('Upload failed: ' + err.message);
            }

            e.target.value = '';
        });

        // Init
        inputEl.focus();
    </script>
</body>
</html>
