# 🌿 Eir — Build & Push Asgard images to ghcr.io
# Polyrepo CI pattern. Eir is OpenEMR fork; this workflow builds the
# Asgard-specific images:
#   - eir-gateway   (Dockerfile.gateway)  — Rust auth/FHIR gateway
#   - asgard-eir    (Dockerfile.custom)   — OpenEMR with Asgard customizations
# Upstream OpenEMR PHP image is built+published by upstream, not here.

name: Build

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'src/RestControllers/**'
      - 'Dockerfile.gateway'
      - 'Dockerfile.custom'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: eir-gateway
            dockerfile: ./Dockerfile.gateway
          - image: asgard-eir
            dockerfile: ./Dockerfile.custom
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/megawiz-dev-team/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/megawiz-dev-team/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ci-success:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build.result }}" != "success" ]; then echo "❌ build failed"; exit 1; fi
          echo "✅ build passed"
